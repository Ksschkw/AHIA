[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ahia"
version = "0.1.0"
description = "AHIA - multi-tenant, offline-first business operating system for informal commerce"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Ksschkw", email = "kookafor893@gmail.com" }]
keywords = ["ahia", "commerce", "multitenant", "offline-first", "fastapi"]

# Runtime dependencies.
#
# Every entry needs a reason to exist. The rule from the scaffold
# specification is that no package is added merely because it is convenient.
dependencies = [
  # HTTP transport: the API framework and its ASGI server.
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",

  # Configuration and wire contracts.
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",

  # Persistence: PostgreSQL only, async driver, migrations.
  "sqlalchemy[asyncio]>=2.0.30,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",

  # Authentication primitives. Standard, audited mechanisms only.
  "pyjwt>=2.8,<3.0",
  "argon2-cffi>=23.1,<26.0",

  # Outbound HTTP client used by integration adapters behind resilience
  # primitives. Present from the start so adapters never reach for urllib.
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Development tooling. Pinned through the committed lockfile like everything
# else; the split exists so a production image can install runtime only.
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<7.0",
  "anyio>=4.3,<5.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "import-linter>=2.0,<3.0",
  "pip-audit>=2.7,<3.0",
  "pre-commit>=3.7,<5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ahia = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff - lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8 naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # builtin shadowing
  "C4",   # comprehensions
  "DTZ",  # naive datetime detection - timezone-aware timestamps only
  "T20",  # print statements - use the structured logger
  "SIM",  # simplifications
  "TID",  # tidy imports
  "RUF",  # ruff-specific
  "S",    # bandit security rules
  "ASYNC",# async correctness
  "BLE",  # blind except
  "PL",   # pylint subset
]
ignore = [
  "PLR0913", # too many arguments: repository and service signatures are explicit by design
  "PLR2004", # magic value comparison: allowed in tests, reviewed elsewhere
  "S101",    # assert: legitimate in tests, forbidden in src by test-scoped config below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert: the test assertion mechanism
  "S105",
  "S106",
  "S603",    # subprocess: the repository tests deliberately run the git binary
  "S607",    # partial executable path: git is resolved from PATH on purpose
  "PLR2004", # magic value comparison: expected values are the point of a test
  "SLF001",  # private member access: guards are tested at their internals
]
# The developer guards are command-line tools. Plain stdout status lines are
# their contract; the structured logger is for the application, not for a script
# a developer runs by hand in a terminal.
"scripts/**" = ["T201"]
"alembic/versions/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy - static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ahia"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_return_any = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=ahia",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
]
markers = [
  "unit: fast, isolated, no external process",
  "integration: requires the test PostgreSQL database",
  "security: verifies a security invariant from the specifications",
  "architecture: verifies layer dependency contracts",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["ahia"]
branch = true
omit = ["*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
