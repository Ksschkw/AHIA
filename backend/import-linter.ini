; Architecture enforcement for the AHIA backend.
;
; The five-layer model and its invariants are defined in
; docs/ARCHITECTURE.md. This file is where they become executable: every
; contract below fails the build if a layer reaches outward.
;
; Run directly with:
;     lint-imports --config import-linter.ini
; or through the test suite, which is the gate that actually matters:
;     pytest tests/architecture
;
; Two contract types are used together:
;   * layers    - the general inward-only direction along the main chain
;   * forbidden - the exact cross-layer imports that must never appear, even
;                 though the layers contract would not catch them on its own
;                 (schemas, middleware and integrations are not on the chain)

[importlinter]
root_package = ahia
; External packages are inspected so the entities contract can forbid an
; ORM, a web framework or a database driver from entering the domain.
include_external_packages = True


[importlinter:contract:layer-direction]
name = Transport depends on services, services on persistence, persistence on entities
type = layers
layers =
    ahia.routers
    ahia.services
    ahia.crud
    ahia.models.entities


[importlinter:contract:entities-are-framework-free]
name = Entities import nothing but the standard library
type = forbidden
include_external_packages = True
source_modules =
    ahia.models.entities
forbidden_modules =
    ahia.schemas
    ahia.crud
    ahia.services
    ahia.routers
    ahia.core
    ahia.middleware
    ahia.integrations
    fastapi
    pydantic
    pydantic_settings
    sqlalchemy
    alembic
    asyncpg
    httpx
    jwt
    argon2


[importlinter:contract:schemas-are-wire-contracts]
name = Schemas depend on entities at most, never on persistence, logic or transport
type = forbidden
source_modules =
    ahia.schemas
forbidden_modules =
    ahia.crud
    ahia.services
    ahia.routers
    ahia.middleware
    ahia.integrations


[importlinter:contract:crud-is-persistence-only]
name = Persistence does not import logic, transport, contracts or adapters
type = forbidden
source_modules =
    ahia.crud
forbidden_modules =
    ahia.services
    ahia.routers
    ahia.middleware
    ahia.schemas
    ahia.integrations


[importlinter:contract:services-own-no-transport]
name = Services never import transport, middleware or provider adapters
type = forbidden
source_modules =
    ahia.services
forbidden_modules =
    ahia.routers
    ahia.middleware
    ahia.integrations


[importlinter:contract:routers-stay-thin]
name = Transport reaches persistence only through services
type = forbidden
source_modules =
    ahia.routers
forbidden_modules =
    ahia.crud
    ahia.models.entities
    ahia.integrations


[importlinter:contract:core-is-self-contained]
name = Cross-cutting core imports no application layer
type = forbidden
source_modules =
    ahia.core
forbidden_modules =
    ahia.schemas
    ahia.crud
    ahia.services
    ahia.routers
    ahia.middleware
    ahia.integrations
    ahia.models


[importlinter:contract:middleware-is-self-contained]
name = Middleware imports core only
type = forbidden
source_modules =
    ahia.middleware
forbidden_modules =
    ahia.schemas
    ahia.crud
    ahia.services
    ahia.routers
    ahia.integrations
    ahia.models


[importlinter:contract:integrations-are-adapters]
name = Provider adapters import core only, never a layer
type = forbidden
source_modules =
    ahia.integrations
forbidden_modules =
    ahia.schemas
    ahia.crud
    ahia.services
    ahia.routers
    ahia.middleware
    ahia.models
