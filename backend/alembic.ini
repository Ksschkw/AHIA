# Alembic configuration for the AHIA backend.
#
# The database URL is deliberately absent: it is read from application settings in
# alembic/env.py, so migrations use the same configuration as the service and no
# credential ever appears in this file.
#
# The connection used for migrations is the direct one (DATABASE_MIGRATION_URL when
# set), not the pooled endpoint: a migration that alters many objects in one
# transaction must not be routed to different backends part-way through.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Timestamps in filenames keep migrations ordered by when they were written, which
# is how a reviewer reads them.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Version locations, relative to this file.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
