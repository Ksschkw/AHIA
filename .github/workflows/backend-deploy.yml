# Migrate first, then point the platform at the image that was just built.
#
# The sequence is the point. Migrations have to reach the database **before** the new code serves
# traffic, and the service is only re-pointed if the migration succeeded - which is why this is one
# workflow with ordered steps rather than three workflows triggered independently by the same push.
#
# Until the Northflank values exist, this prints what to do and exits successfully. A pipeline that was
# never configured should not turn a push red: a red build should mean something is wrong with the code.
name: backend deploy

on:
  workflow_run:
    workflows: ["backend image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Read as well as write: the migration runs from the image this workflow pulls back down.
  packages: read

jobs:
  deploy:
    name: migrate, then pin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only after the image job succeeded: there is nothing to deploy otherwise.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sign in to the registry
        if: vars.NORTHFLANK_SERVICE_ID != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the deployment is configured
        id: configured
        env:
          SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID }}
          PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
        run: |
          if [[ -z "${SERVICE_ID}" || -z "${PROJECT_ID}" ]]; then
            {
              echo "### Deployment is not configured yet"
              echo ""
              echo "Set these once, and this workflow takes over:"
              echo ""
              echo '```'
              echo 'gh secret set NORTHFLANK_API_TOKEN --body "<token>"'
              echo 'gh variable set NORTHFLANK_PROJECT_ID --body "<project id>"'
              echo 'gh variable set NORTHFLANK_SERVICE_ID --body "<service id>"'
              echo '```'
              echo ""
              echo "See docs/DEPLOYMENT.md section 3."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out which image this run is about
        id: image
        if: steps.configured.outputs.ready == 'true'
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${OWNER}/ahia-backend:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Make sure the image for this commit exists
        if: steps.configured.outputs.ready == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          # The image is built by a *different* workflow, which skips itself when a push touched nothing
          # under backend/ - so a deploy can be asked for a commit that has no image. Saying that plainly
          # is worth more than a pull error three steps later.
          if ! docker manifest inspect "${IMAGE_REF}" >/dev/null 2>&1; then
            {
              echo "### No image for this commit"
              echo ""
              echo "\`${IMAGE_REF}\` does not exist."
              echo ""
              echo "The image workflow skips a push that touches nothing under \`backend/\`, so either:"
              echo ""
              echo "- run **backend image** manually for this commit, or"
              echo "- push a commit that changes \`backend/\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "no image for ${IMAGE_REF}"; exit 1
          fi

      - name: Create the tables, using the image that was just built
        # The id matters: the pinning step below waits for `steps.migrate.outcome`, and a step with no
        # id makes that condition silently false - so the migration could succeed and the service never
        # be re-pointed, which looks exactly like the pipeline doing nothing.
        id: migrate
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_TOKEN_PEPPER: ${{ secrets.REFRESH_TOKEN_PEPPER }}
          STORAGE_PROVIDER: cloudinary
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -euo pipefail
          # The migration runs from the *same image* the service is about to run, so the code that
          # changes the schema is the code that was tested with it. No Northflank job exists, and none
          # is needed: the ordering guarantee comes from this workflow's own step order, which is
          # easier to read than a chain of platform triggers.
          #
          # It runs before the service is re-pointed, and a failure stops the deploy here - leaving the
          # previous version serving, which is the whole point of migrating first.
          # Every variable the application's settings need, because the migration imports the same
          # configuration the API does - a missing one fails here as a validation error that looks
          # nothing like a database problem.
          docker run --rm \
            -e "DATABASE_URL=${DATABASE_URL}" \
            -e "DATABASE_REQUIRE_SSL=true" \
            -e "JWT_SECRET=${JWT_SECRET}" \
            -e "REFRESH_TOKEN_PEPPER=${REFRESH_TOKEN_PEPPER}" \
            -e "APP_ENV=production" \
            -e "STORAGE_PROVIDER=${STORAGE_PROVIDER}" \
            -e "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}" \
            -e "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}" \
            -e "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}" \
            "${{ steps.image.outputs.ref }}" \
            alembic upgrade head

      - name: Point the service at this commit's image
        if: steps.configured.outputs.ready == 'true' && steps.migrate.outcome == 'success'
        env:
          API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
          SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.northflank.com/v1/projects/${PROJECT_ID}/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"deployment\":{\"imagePath\":\"${{ steps.image.outputs.ref }}\"}}"

          {
            echo "### Deployed"
            echo ""
            echo "- image: \`${{ steps.image.outputs.ref }}\`"
            echo "- migration: ran from that same image, before the service was re-pointed"
          } >> "$GITHUB_STEP_SUMMARY"
