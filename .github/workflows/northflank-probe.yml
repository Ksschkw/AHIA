# Ask Northflank what it actually accepts, instead of guessing at its API.
#
# Four shapes were tried for "point this service at a new image" and every one answered 405 Method Not
# Allowed, which is the API saying the path exists and the method does not. That is a precise answer, and
# it means the next useful step is not another guess but a question:
#
#   * which projects does this token see, and what are their ids?
#   * which services are in the project, and what are their ids?
#   * what methods does each candidate path allow? (`OPTIONS` returns an `Allow` header saying so.)
#
# Run this once by hand and read the output. It changes nothing - every request is a read except the
# final POST, which is guarded and only attempted if the reads suggest the shape is right.
name: northflank probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ask the API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Which projects does this token see?
        env:
          API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "GET /v1/projects"
          curl --silent --show-error --write-out '\n--> HTTP %{http_code}\n' \
            "https://api.northflank.com/v1/projects" \
            --header "Authorization: Bearer ${API_TOKEN}" | python3 -m json.tool 2>/dev/null \
            || curl --silent --show-error --write-out '\n--> HTTP %{http_code}\n' \
                 "https://api.northflank.com/v1/projects" \
                 --header "Authorization: Bearer ${API_TOKEN}"

      - name: Which services are in the configured project?
        env:
          API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "GET /v1/projects/${PROJECT_ID}/services"
          curl --silent --show-error --write-out '\n--> HTTP %{http_code}\n' \
            "https://api.northflank.com/v1/projects/${PROJECT_ID}/services" \
            --header "Authorization: Bearer ${API_TOKEN}"

      - name: What does the service actually look like?
        env:
          API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
          SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID }}
        run: |
          set -euo pipefail
          service="https://api.northflank.com/v1/projects/${PROJECT_ID}/services/${SERVICE_ID}"

          echo "=== the service, in full"
          curl --silent --show-error "${service}" \
            --header "Authorization: Bearer ${API_TOKEN}" | python3 -m json.tool

          echo "=== its recent deployments"
          curl --silent --show-error "${service}/deployments?limit=3" \
            --header "Authorization: Bearer ${API_TOKEN}" | python3 -m json.tool

      - name: Which paths exist, and what do they allow?
        env:
          API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
          SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID }}
        run: |
          set -euo pipefail
          base="https://api.northflank.com/v1/projects/${PROJECT_ID}/services/${SERVICE_ID}"

          # OPTIONS names the methods a path accepts, which is how the last round was settled. Asking
          # every plausible path at once is cheaper than one deployment run per guess.
          for path in "" "/deployment" "/deployments" "/deploy" "/redeploy" "/restart" "/build"; do
            printf '%-14s ' "${path:-/(the service)}"
            curl --silent --show-error --head --request OPTIONS "${base}${path}" \
              --header "Authorization: Bearer ${API_TOKEN}" \
              | tr -d '\r' | grep -iE "^allow:" | head -1 || echo "(no allow header)"
          done

      - name: Does the deployment body need nesting?
        env:
          API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
          SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID }}
          IMAGE_REF: ghcr.io/ksschkw/ahia-backend:main
        run: |
          set -euo pipefail
          base="https://api.northflank.com/v1/projects/${PROJECT_ID}/services/${SERVICE_ID}"

          try() {
            local label="$1" body="$2"
            echo "=== ${label}"
            curl --silent --show-error --request POST "${base}/deployment" \
              --header "Authorization: Bearer ${API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${body}" | head -c 500
            echo
          }

          try "flat imagePath"      "$(jq -n --arg i "${IMAGE_REF}" '{imagePath: $i}')"
          try "deployment.docker"   "$(jq -n --arg i "${IMAGE_REF}" '{deployment: {docker: {imagePath: $i}}}')"
          try "deployment.external" "$(jq -n --arg i "${IMAGE_REF}" '{deployment: {external: {imagePath: $i}}}')"
          try "no body"             "{}"

          echo "=== and what the service says now"
          curl --silent --show-error "${base}" \
            --header "Authorization: Bearer ${API_TOKEN}" | python3 -m json.tool | head -40
